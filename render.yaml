services:
  - type: web
    name: srcingestion-web
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: Dockerfile
    # envVars can be set in Render dashboard; do NOT store secrets here
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FOOTBALL_API_KEY
        sync: false
  - type: worker
    name: srcingestion-bot
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: Dockerfile
    startCommand: python bot.py
    # This worker runs the Telegram bot process. Set TELEGRAM_TOKEN in Render env.
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
