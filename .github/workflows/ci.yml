name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run py_compile check
        run: |
          python -m py_compile $(git ls-files '*.py')
      - name: Run basic smoke (build_features)
        run: |
          python -c "from src.features.build_features import create_ml_dataset; print('OK', getattr(create_ml_dataset(),'__name__', 'fn'))"
